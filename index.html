<html>
  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Koi Mil Gaya Keyboard</title>

      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          gap: 20px;
          background: #0d0d0d;
          color: white;
          font-family: Arial, sans-serif;
          text-align: center;
        }

        h1 {
          font-size: 42px;
        }

        p {
          color: #aaa;
          font-size: 18px;
        }

        .status {
          padding: 12px 25px;
          border: 1px solid #333;
          border-radius: 12px;
          background: #171717;
          color: #00ff9d;
        }

        .keyboard {
          width: min(900px, 90%);
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 8px;
          margin-top: 20px;
        }

        .key {
          width: 55px;
          height: 55px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #222;
          border: 1px solid #444;
          border-radius: 10px;
          font-size: 18px;
          transition: 0.08s;
        }

        .key.active {
          transform: scale(0.92);
          background: #00ff9d;
          color: #000;
          box-shadow: 0 0 20px #00ff9d;
        }
      </style>
    </head>

    <body>
      <h1>👽 Koi Mil Gaya</h1>
      <p>Keyboard ki koi bhi key press karo 😭</p>

      <div class="status" id="status">Ready...</div>

      <div class="keyboard" id="keyboard"></div>

      <audio id="sound" src="koi-mil-gaya.mp3" preload="auto"></audio>

      <script>
        const sound = document.getElementById("sound");
        const status = document.getElementById("status");
        const keyboard = document.getElementById("keyboard");

        const keys = [
          ..."1234567890",
          ..."QWERTYUIOP",
          ..."ASDFGHJKL",
          ..."ZXCVBNM",
        ];

        keys.forEach((key) => {
          const div = document.createElement("div");
          div.className = "key";
          div.textContent = key;
          div.dataset.key = key.toLowerCase();
          keyboard.appendChild(div);
        });

        document.addEventListener("keydown", (event) => {
          const pressedKey = event.key.toLowerCase();

          const keyElement = document.querySelector(
            `.key[data-key="${pressedKey}"]`,
          );

          if (keyElement) {
            keyElement.classList.add("active");

            setTimeout(() => {
              keyElement.classList.remove("active");
            }, 100);
          }

          // Same sound on every key press
          sound.currentTime = 0;

          sound.play().catch(() => {
            console.log("Browser blocked audio playback.");
          });

          status.textContent = `🎵 ${event.key} pressed!`;
        });

        document.addEventListener("keyup", () => {
          status.textContent = "Press any key...";
        });
      </script>
    </body>
  </html>
</html>
